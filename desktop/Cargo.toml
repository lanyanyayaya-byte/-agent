[package]
name = "knowledgeagent"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
uuid = { version = "1", features = ["serde"] }
zeroize = "1.9.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSOpenPanel", "NSSavePanel", "NSWindow", "block2", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString", "NSURL"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["UTType"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
sidecar-onefile = []
